<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AURA — Login</title><link rel="stylesheet" href="css/style.css"></head>
<body class="tool-page auth-page"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><main class="auth-shell"><div class="auth-brand"><div class="brand-orb"></div><strong>AURA</strong><span>AI • SEE • LISTEN • THINK • ACT</span></div><div class="auth-card"><div class="auth-tabs"><button id="loginTab" class="active">Login</button><button id="signupTab">Sign up</button></div><div id="authMessage" class="result-box" style="display:none"></div><form id="authForm"><div id="nameField" class="auth-field" style="display:none"><label>Name</label><input id="name" autocomplete="name" placeholder="Your name"></div><div class="auth-field"><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="auth-field"><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"></div><button class="primary-btn" type="submit" id="submitBtn">Login</button></form><p class="auth-foot">Your AURA account stores tasks, reminders and notes in the FastAPI database.</p></div></main><script type="module" src="js/auth.js"></script></body></html>
